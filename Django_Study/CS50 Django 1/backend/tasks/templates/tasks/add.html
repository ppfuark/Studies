{% block title %}Add Task{% endblock %}

{% block body %}

    <form action="{% url 'tasks:add' %}" method="post">
        {% csrf_token %}
        {{ form }}
        <input type="submit">
    </form>
    <a href="{% url 'tasks:index' %}">Go Home</a>
{% endblock %}
